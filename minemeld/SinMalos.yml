description: >
    SinMalos Feeds
url: https://www.rediris.es/cert/sinmalos

prototypes:
    SinMalos-Lite-HC-PrototypeMiner:
        author: Víctor Barahona (uam.es)
        development_status: STABLE
        node_type: miner
        indicator_types:
            - IPv4
        tags:
            - SM-Lite-HC
        description: >
            Versión reducida de la lista Multisource con indicadores que han
            sido reportados por 3 o más instituciones.
            Recomendada para instituciones con equipos de menos recursos que
            no pueden cargar la Multisource o que prefieren una lista más
            reducida y de mayor confianza.
        config:
            source_name: SinMalos-Lite-HC
            url: https://sinmalos.rediris.es/SM-Lite-HC
            age_out:
                default: null
                interval: 86400
                sudden_death: true
            attributes:
                type: IPv4
                direction: inbound
                share_level: green
                confidence: 90
                sinmalos_lite_hc: true
            interval: 300
        class: minemeld.ft.http.HttpFT
    SinMalos-MultiSource-PrototypeMiner:
        author: Víctor Barahona (uam.es)
        development_status: STABLE
        node_type: miner
        indicator_types:
            - IPv4
        tags:
            - SM-MultiSource-HC
        description: >
            Feed que contiene todos los IoCs de SinMalos reportados por
            2 o más instituciones. En los atributos de cada IoC se incluye el
            identificador de cada institucion que lo ha reportado.
        config:
            source_name: SinMalos-MultiSource-HC
            url: https://sinmalos.rediris.es/SM-MultiSource-HC
            age_out:
                default: null
                interval: 86400
                sudden_death: true
            attributes:
                type: IPv4
                direction: inbound
                share_level: green
                confidence: 80
                sinmalos_multisource: true
            interval: 300
        class: minemeld.ft.http.HttpFT
    SinMalos-ALL-PrototypeMiner:
        author: Victor Barahona (uam.es)
        development_status: STABLE
        node_type: miner
        indicator_types:
            - IPv4
        tags:
            - SM-ALL
        description: >
            Feed que contiene todos los IoCs reportados a SinMalos.
            Puede incluir falsos positivos.
            Recomendada solo para consulta o generar alertas.
        config:
            source_name: SinMalos-ALL
            url: https://sinmalos.rediris.es/SM-ALL
            age_out:
                default: null
                interval: 86400
                sudden_death: true
            attributes:
                type: IPv4
                direction: inbound
                share_level: green
                confidence: 60
                sinmalos_all: true
            interval: 900
        class: minemeld.ft.http.HttpFT
    SinMalos2-Scanners-PrototypeMiner:
        author: Víctor Barahona (uam.es)
        development_status: STABLE
        node_type: miner
        indicator_types:
            - IPv4
        tags:
            - SM2-Scanners
        description: >
            Lista que contiene indicadores de escaneos detectados en
            firewalls de las instituciones y recogidos por syslog.
            Recomendada para la mayoría de las instituciones.
            Se aplica en equipos perimetrales como firewalls en INBOUND.
        config:
            source_name: SinMalos2-Scanners
            url: https://sinmalos.rediris.es/SM2-Scanners
            age_out:
                default: null
                interval: 86400
                sudden_death: true
            attributes:
                type: IPv4
                direction: inbound
                share_level: green
                confidence: 70
                sinmalos2_scanners: true
            interval: 300
        class: minemeld.ft.http.HttpFT
    SinMalos2-Threats-PrototypeMiner:
        author: Víctor Barahona (uam.es)
        development_status: STABLE
        node_type: miner
        indicator_types:
            - IPv4
        tags:
            - SM2-Threats
        description: >
            Lista que contiene indicadores de ataques detectados en firewalls
            de las instituciones y recogidos por syslog.
            Recomendada para la mayoría de instituciones.
            Se aplica en equipos perimetrales como firewalls en INBOUND.
        config:
            source_name: SinMalos2-Threats
            url: https://sinmalos.rediris.es/SM2-Threats
            age_out:
                default: null
                interval: 86400
                sudden_death: true
            attributes:
                type: IPv4
                direction: inbound
                share_level: green
                confidence: 75
                sinmalos2_threats: true
            interval: 300
        class: minemeld.ft.http.HttpFT
    SinMalos-Lite-HC-PrototypeOutput:
        author: Víctor Barahona (uam.es)
        development_status: STABLE
        node_type: output
        indicator_types:
          - IPv4
          - IPv6
        tags:
          - SM-Lite-HC
        description: >
            Versión reducida de la lista Multisource con indicadores que han
            sido reportados por 3 o más instituciones.
            Recomendada para instituciones con equipos de menos recursos que
            no pueden cargar la Multisource o que prefieren una lista más
            reducida y de mayor confianza.

            EDL SinMalos con alto nivel de confianza. Indicadores 
            reportados por 3 o mas instituciones (MultiSource).
        class: minemeld.ft.redis.RedisSet
        config:
            store_value: true
            infilters:
                - actions:
                      - accept
                  conditions:
                      - __method == 'withdraw'
                  name: accept withdraws
                - actions:
                      - accept
                  conditions:
                      - sinmalos_lite_hc == true
                  name: sinmalos_lite_hc
                - actions:
                      - drop
                  name: drop all
    SinMalos-MultiSource-HC-PrototypeOutput:
        author: Víctor Barahona (uam.es)
        development_status: STABLE
        node_type: output
        indicator_types:
          - IPv4
          - IPv6
        tags:
          - SM-MultiSource-HC
        description: >
            EDL SinMalos con alto nivel de confianza. Indicadores 
            reportados por 2 o mas instituciones (MultiSource).
        class: minemeld.ft.redis.RedisSet
        config:
            store_value: true
            infilters:
                - actions:
                      - accept
                  conditions:
                      - __method == 'withdraw'
                  name: accept withdraws
                - actions:
                      - accept
                  conditions:
                      - sinmalos_multisource == true
                  name: sinmalos_multisource
                - actions:
                      - drop
                  name: drop all
    SinMalos-ALL-PrototypeOutput:
        author: Víctor Barahona (uam.es)
        development_status: STABLE
        node_type: output
        indicator_types:
          - IPv4
          - IPv6
        tags:
          - SM-ALL
        description: >
            EDL SinMalos con nivel de confianza medio 
            y valores de origen de cada institución.
            Puede incluir falsos positivos.
            Recomendada solo para consulta o generar alertas.
        class: minemeld.ft.redis.RedisSet
        config:
            store_value: true
            infilters:
                - actions:
                      - accept
                  conditions:
                      - __method == 'withdraw'
                  name: accept withdraws
                - actions:
                      - accept
                  conditions:
                      - sinmalos_all == true
                  name: sinmalos_all
                - actions:
                      - drop
                  name: drop all
    SM2-Scanners-PrototypeOutput:
        author: Víctor Barahona (uam.es)
        development_status: STABLE
        node_type: output
        indicator_types:
          - IPv4
          - IPv6
        tags:
          - SM2-Scanners
        description: >
            EDL SinMalos2-Scanners con alto nivel de confianza.
            Indicadores de escaneos detectados en firewalls y recogidos
            por syslog.
        class: minemeld.ft.redis.RedisSet
        config:
            store_value: true
            infilters:
                - actions:
                      - accept
                  conditions:
                      - __method == 'withdraw'
                  name: accept withdraws
                - actions:
                      - accept
                  conditions:
                      - sinmalos2_scanners == true
                  name: sinmalos2_scanners
                - actions:
                      - drop
                  name: drop all
    SM2-Threats-PrototypeOutput:
        author: Víctor Barahona (uam.es)
        development_status: STABLE
        node_type: output
        indicator_types:
          - IPv4
          - IPv6
        tags:
          - SM2-Threats
        description: >
            EDL SinMalos2-Threats con alto nivel de confianza.
            Indicadores de ataques detectados en firewalls y recogidos
            por syslog.
        class: minemeld.ft.redis.RedisSet
        config:
            store_value: true
            infilters:
                - actions:
                      - accept
                  conditions:
                      - __method == 'withdraw'
                  name: accept withdraws
                - actions:
                      - accept
                  conditions:
                      - sinmalos2_threats == true
                  name: sinmalos2_threats
                - actions:
                      - drop
                  name: drop all