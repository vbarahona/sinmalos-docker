description: >
    SinMalos Feeds
url: https://www.rediris.es/cert/sinmalos

prototypes:
    SinMalos-Lite-HC-Miner:
        author: Víctor Barahona (uam.es)
        development_status: STABLE
        node_type: miner
        indicator_types:
            - IPv4
        tags:
            - SinMalos
        description: >
            Versión reducida de la lista Multisource con indicadores que han
            sido reportados por 3 o más instituciones.
            Recomendada para instituciones con equipos de menos recursos que
            no pueden cargar la Multisource o que prefieren una lista más
            reducida y de mayor confianza.
        config:
            source_name: SinMalos-Lite-HC
            url: https://sinmalos.rediris.es/SM-Lite-HC
            age_out:
                default: null
                interval: 86400
                sudden_death: true
            attributes:
                type: IPv4
                direction: inbound
                share_level: green
                confidence: 90
                sinmalos: true
                sinmalos_lite: true
            interval: 300
        class: minemeld.ft.http.HttpFT
    ELSA-CCN-CERT:
        author: Víctor Barahona (uam.es)
        development_status: STABLE
        node_type: miner
        indicator_types:
            - IPv4
        tags:
            - SinMalos
            - ELSA
        description: >
            Lista con las 200 direcciones IP de los escaneadores que
            pertenecen y son usados por el CCN para escaneos de superficie.
            Estas IPs no son maliciosas.
            Recomendada para ser permitida o, en caso de no querer recibir
            esos escaneos, se puede usar como bloqueo.
            Se aplica en equipos perimetrales como firewalls en INBOUND.
        config:
            source_name: ELSA-CCN-CERT
            url: https://sinmalos.rediris.es/ELSA-CCN-CERT-Inbound
            age_out:
                default: null
                interval: 86400
                sudden_death: true
            attributes:
                type: IPv4
                direction: inbound
                share_level: green
                confidence: 90
                sinmalos: true
                elsa_scanners: true
            interval: 300
        class: minemeld.ft.http.HttpFT
    SinMalos2-Scanners:
        author: Víctor Barahona (uam.es)
        development_status: STABLE
        node_type: miner
        indicator_types:
            - IPv4
        tags:
            - SinMalos
        description: >
            Lista que contiene indicadores de escaneos detectados en
            firewalls de las instituciones y recogidos por syslog.
            Recomendada para la mayoría de las instituciones.
            Se aplica en equipos perimetrales como firewalls en INBOUND.
        config:
            source_name: SinMalos2-Scanners
            url: https://sinmalos.rediris.es/SM2-Scanners
            age_out:
                default: null
                interval: 86400
                sudden_death: true
            attributes:
                type: IPv4
                direction: inbound
                share_level: green
                confidence: 90
                sinmalos: true
                sinmalos_scanners: true
            interval: 300
        class: minemeld.ft.http.HttpFT
    SinMalos2-Threats:
        author: Víctor Barahona (uam.es)
        development_status: STABLE
        node_type: miner
        indicator_types:
            - IPv4
        tags:
            - SinMalos
        description: >
            Lista que contiene indicadores de ataques detectados en firewalls
            de las instituciones y recogidos por syslog.
            Recomendada para la mayoría de instituciones.
            Se aplica en equipos perimetrales como firewalls en INBOUND.
        config:
            source_name: SinMalos2-Threats
            url: https://sinmalos.rediris.es/SM2-Threats
            age_out:
                default: null
                interval: 86400
                sudden_death: true
            attributes:
                type: IPv4
                direction: inbound
                share_level: green
                confidence: 90
                sinmalos: true
                sinmalos_threats: true
            interval: 300
        class: minemeld.ft.http.HttpFT
    SinMalos-MultiSource:
        author: Víctor Barahona (uam.es)
        development_status: STABLE
        node_type: miner
        indicator_types:
            - IPv4
        tags:
            - SinMalos
        description: >
            Feed que contiene todos los IoCs de SinMalos reportados por
            2 o más instituciones. En los atributos de cada IoC se incluye el
            identificador de cada institucion que lo ha reportado.
        config:
            source_name: SinMalos-MultiSource-HC
            url: https://sinmalos.rediris.es/SM-MultiSource-HC
            age_out:
                default: null
                interval: 86400
                sudden_death: true
            attributes:
                type: IPv4
                direction: inbound
                share_level: green
                confidence: 80
                sinmalos: true
            interval: 300
        class: minemeld.ft.http.HttpFT
    SinMalos-ALL:
        author: Víctor Barahona (uam.es)
        development_status: STABLE
        node_type: miner
        indicator_types:
            - IPv4
        tags:
            - SinMalos
        description: >
            Feed que contiene todos los IoCs reportados a SinMalos.
        config:
            source_name: SinMalos-ALL
            url: https://sinmalos.rediris.es/SM-ALL
            age_out:
                default: null
                interval: 86400
                sudden_death: true
            attributes:
                type: IPv4
                direction: inbound
                share_level: green
                confidence: 60
                sinmalos: true
            interval: 900
        class: minemeld.ft.http.HttpFT
    SinMalos-Lite-HC:
        author: Víctor Barahona (uam.es)
        development_status: STABLE
        node_type: output
        indicator_types:
          - IPv4
          - IPv6
        tags:
          - SinMalos
        description: >
            Versión reducida de la lista Multisource con indicadores que han
            sido reportados por 3 o más instituciones.
            Recomendada para instituciones con equipos de menos recursos que
            no pueden cargar la Multisource o que prefieren una lista más
            reducida y de mayor confianza.

            EDL SinMalos con alto nivel de confianza (>85). Indicadores 
            reportados por 3 o mas instituciones (MultiSource). TLP-Green
        class: minemeld.ft.redis.RedisSet
        config:
            store_value: true
            infilters:
                - actions:
                      - accept
                  conditions:
                      - __method == 'withdraw'
                  name: accept withdraws
                - actions:
                      - accept
                  conditions:
                      - confidence > 85
                      - direction == 'inbound'
                      - share_level == 'green'
                      - sinmalos == true
                      - sinmalos_lite == true
                  name: accept confidence > 85 and share level green
                - actions:
                      - drop
                  name: drop all
    ELSA-CCN-CERT-Inbound:
        author: Víctor Barahona (uam.es)
        development_status: STABLE
        node_type: output
        indicator_types:
          - IPv4
          - IPv6
        tags:
          - SinMalos
          - ELSA
        description: >
            EDL ELSA-CCN-CERT-Inbound con nivel de confianza alto.
            Direcciones IP de escaneadores del CCN que no son maliciosas
            y se aplican en inbound. TLP-Green.
        class: minemeld.ft.redis.RedisSet
        config:
            store_value: true
            infilters:
                - actions:
                      - accept
                  conditions:
                      - __method == 'withdraw'
                  name: accept withdraws
                - actions:
                      - accept
                  conditions:
                      - confidence >= 75
                      - direction == 'inbound'
                      - share_level == 'green'
                      - elsa_scanners == true
                  name: accept elsa inbound scanners
                - actions:
                      - drop
                  name: drop all
    SM2-Scanners:
        author: Víctor Barahona (uam.es)
        development_status: STABLE
        node_type: output
        indicator_types:
          - IPv4
          - IPv6
        tags:
          - SinMalos
        description: >
            EDL SinMalos2-Scanners con alto nivel de confianza (>85).
            Indicadores de escaneos detectados en firewalls y recogidos
            por syslog. TLP-Green.
        class: minemeld.ft.redis.RedisSet
        config:
            store_value: true
            infilters:
                - actions:
                      - accept
                  conditions:
                      - __method == 'withdraw'
                  name: accept withdraws
                - actions:
                      - accept
                  conditions:
                      - confidence > 85
                      - direction == 'inbound'
                      - share_level == 'green'
                      - sinmalos == true
                      - sinmalos_scanners == true
                  name: accept scanners confidence > 85 and share level green
                - actions:
                      - drop
                  name: drop all
    SM2-Threats:
        author: Víctor Barahona (uam.es)
        development_status: STABLE
        node_type: output
        indicator_types:
          - IPv4
          - IPv6
        tags:
          - SinMalos
        description: >
            EDL SinMalos2-Threats con alto nivel de confianza (>85).
            Indicadores de ataques detectados en firewalls y recogidos
            por syslog. TLP-Green.
        class: minemeld.ft.redis.RedisSet
        config:
            store_value: true
            infilters:
                - actions:
                      - accept
                  conditions:
                      - __method == 'withdraw'
                  name: accept withdraws
                - actions:
                      - accept
                  conditions:
                      - confidence > 85
                      - direction == 'inbound'
                      - share_level == 'green'
                      - sinmalos == true
                      - sinmalos_threats == true
                  name: accept threats confidence > 85 and share level green
                - actions:
                      - drop
                  name: drop all
    SinMalos-MultiSource-HC:
        author: Víctor Barahona (uam.es)
        development_status: STABLE
        node_type: output
        indicator_types:
          - IPv4
          - IPv6
        tags:
          - SinMalos
        description: >
            EDL SinMalos con alto nivel de confianza (>75). Indicadores 
            reportados por 2 o mas instituciones (MultiSource). TLP-Green
        class: minemeld.ft.redis.RedisSet
        config:
            store_value: true
            infilters:
                - actions:
                      - accept
                  conditions:
                      - __method == 'withdraw'
                  name: accept withdraws
                - actions:
                      - accept
                  conditions:
                      - confidence > 75
                      - direction == 'inbound'
                      - share_level == 'green'
                      - sinmalos == true
                  name: accept confidence > 75 and share level green
                - actions:
                      - drop
                  name: drop all
    SinMalos-ALL-MC:
        author: Víctor Barahona (uam.es)
        development_status: STABLE
        node_type: output
        indicator_types:
          - IPv4
          - IPv6
        tags:
          - SinMalos
        description: >
            EDL SinMalos con nivel de confianza medio (>50), TLP-Green 
            y valores de origen de cada institución
        class: minemeld.ft.redis.RedisSet
        config:
            store_value: true
            infilters:
                - actions:
                      - accept
                  conditions:
                      - __method == 'withdraw'
                  name: accept withdraws
                - actions:
                      - accept
                  conditions:
                      - confidence >= 50
                      - direction == 'inbound'
                      - share_level == 'green'
                      - sinmalos == true
                  name: accept confidence >50
                - actions:
                      - drop
                  name: drop all