description: >
    CCN-CERT Reyes Feeds
url: https://www.ccn-cert.cni.es/soluciones-seguridad/reyes.html

prototypes:
    REYES-CCN-CERT-Inbound-PrototypeMiner:
        class: minemeld.ft.http.HttpFT
        config:
            age_out:
                default: null
                interval: 86400
                sudden_death: true
            attributes:
                confidence: 70
                direction: inbound
                ccn_reyes_inbound: true
                share_level: yellow
                type: IPv4
            interval: 300
            source_name: REYES-CCN-CERT-Inbound
            url: https://sinmalos.rediris.es/REYES-CCN-CERT-Inbound
        description: IoCs de la plataforma de REYES (CCN-CERT) para su filtrado en inbound.
        development_status: STABLE
        indicator_types:
        - IPv4
        node_type: miner
        tags:
        - REYES-CCN-CERT-Inbound
        - ShareLevelYellow
    REYES-CCN-CERT-Outbound-PrototypeMiner:
        class: minemeld.ft.http.HttpFT
        config:
            age_out:
                default: null
                interval: 86400
                sudden_death: true
            attributes:
                confidence: 70
                direction: outbound
                ccn_reyes_outbound: true
                share_level: yellow
                type: IPv4
            interval: 300
            source_name: REYES-CCN-CERT-Outbound
            url: https://sinmalos.rediris.es/REYES-CCN-CERT-Outbound
        description: IoCs de la plataforma de REYES (CCN-CERT) para su filtrado en outbound.
        development_status: STABLE
        indicator_types:
        - IPv4
        node_type: miner
        tags:
        - REYES-CCN-CERT-Outbound
        - ShareLevelYellow
    REYES-CCN-CERT-Inbound-PrototypeOutput:
        class: minemeld.ft.redis.RedisSet
        config:
            infilters:
            -   actions:
                - accept
                conditions:
                - __method == 'withdraw'
                name: accept withdraws
            -   actions:
                - accept
                conditions:
                - ccn_reyes_inbound == true
                name: REYES CCN-CERT Inbound
            -   actions:
                - drop
                name: drop all
            store_value: true
        description: IoCs de la plataforma de REYES (CCN-CERT) para su filtrado en inbound.
        development_status: STABLE
        indicator_types:
        - IPv4
        node_type: output
        tags:
        - REYES-CCN-CERT-Inbound
        - ShareLevelYellow
    REYES-CCN-CERT-Outbound-PrototypeOutput:
        class: minemeld.ft.redis.RedisSet
        config:
            infilters:
                - actions:
                      - accept
                  conditions:
                      - __method == 'withdraw'
                  name: accept withdraws
                - actions:
                      - accept
                  conditions:
                      - ccn_reyes_outbound == true
                  name: REYES CCN-CERT Outbound
                - actions:
                      - drop
                  name: drop all
            store_value: true
        description: IoCs de la plataforma de REYES (CCN-CERT) para su filtrado en outbound.
        development_status: STABLE
        indicator_types:
            - IPv4
        node_type: output
        tags:
            - REYES-CCN-CERT-Outbound
            - ShareLevelYellow